name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # 断言实际生效的 JVM 是 25，避免 daemon 悄悄回落到镜像自带的 21。
      - name: Show toolchain
        run: ./gradlew --version --console=plain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # build 内含测试、字节码版本校验与公共模块依赖边界校验。
      - name: Build
        run: ./gradlew build --console=plain

      # --json 是对外契约：起一次联调服务，逐行校验 status 的真实输出；
      # 再对关闭的端口跑一次，确认失败时 ok=false 且退出码非零。
      - name: CLI JSON smoke
        run: |
          set -euo pipefail
          ./gradlew :testing:minestom:installDist :app:installDist --console=plain
          ./testing/minestom/build/install/minestom/bin/minestom --port 25565 > server.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'event=server.started' server.log && break
            sleep 1
          done
          grep -q 'event=server.started' server.log || { cat server.log; exit 1; }
          ./app/build/install/pickaxecraft/bin/pickaxecraft status 127.0.0.1 25565 --json > status.jsonl
          cat status.jsonl
          python3 - <<'PY'
          import json
          lines = [line for line in open("status.jsonl") if line.strip()]
          assert len(lines) == 1, lines
          obj = json.loads(lines[0])
          assert obj["type"] == "status" and obj["ok"] is True, obj
          assert obj["exitCode"] == 0, obj
          assert obj["data"]["protocol"] == 776, obj
          assert obj["session"]["host"] == "127.0.0.1" and obj["session"]["port"] == 25565, obj
          print("json smoke ok")
          PY
          set +e
          ./app/build/install/pickaxecraft/bin/pickaxecraft status 127.0.0.1 1 --json > failed.jsonl
          code=$?
          set -e
          cat failed.jsonl
          python3 - <<'PY'
          import json
          lines = [line for line in open("failed.jsonl") if line.strip()]
          assert len(lines) == 1, lines
          obj = json.loads(lines[0])
          assert obj["type"] == "status" and obj["ok"] is False, obj
          assert obj["exitCode"] != 0 and obj["error"]["kind"], obj
          print("json failure smoke ok")
          PY
          test "$code" -ne 0

      # 失败时把测试报告带出来，否则只能看到“某文件某行断言失败”，无法判断断言内容。
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Windows 只跑 build：`ShutdownHookTest` 依赖 SIGTERM，在 Windows 上自动跳过，
  # 由上面的 Linux job 覆盖。其余测试、字节码校验与模块边界检查都要在 Windows 通过。
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # macOS 跑完整 build，包括 libGDX 消费示例的测试：
  # `gdx-platform:<version>-natives-desktop` 内含 `libgdxarm64.dylib`，
  # 因此 Apple Silicon runner 不需要跳过该模块。若将来 natives 缺失，
  # 先记录具体错误再决定条件跳过，不要直接静默关闭覆盖。
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
