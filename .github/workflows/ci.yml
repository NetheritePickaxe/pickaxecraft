name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # 断言实际生效的 JVM 是 25，避免 daemon 悄悄回落到镜像自带的 21。
      - name: Show toolchain
        run: ./gradlew --version --console=plain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # build 内含测试、字节码版本校验与公共模块依赖边界校验。
      - name: Build
        run: ./gradlew build --console=plain

      # 失败时把测试报告带出来，否则只能看到“某文件某行断言失败”，无法判断断言内容。
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
