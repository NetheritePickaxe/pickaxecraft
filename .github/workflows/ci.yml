name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # 不使用 android-actions/setup-android：它的默认包列表含已下架的 tools 包，
      # 会让该步以 "Failed to find package 'tools'" 失败；runner 镜像本身已带 SDK。
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          "$sdkmanager" --version
          # sdkmanager 读完即退出，yes 会收到 SIGPIPE(141)；pipefail 下这会被判为失败，
          # 因此这里显式忽略该管道的退出码。
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # 断言实际生效的 JVM 是 25，避免 daemon 悄悄回落到镜像自带的 21。
      - name: Show toolchain
        run: ./gradlew --version --console=plain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # build 内含测试、字节码版本校验与公共模块依赖边界校验。
      - name: Build
        run: ./gradlew build --console=plain
