# 版本目录是本仓库唯一的版本事实来源。模块构建脚本不得硬编码版本号。
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# 构建工具链
kotlin = "2.4.21"

# 协议运行时。MCProtocolLib 按 Minecraft 版本发版，26.2 对应协议 776，
# 与 Minestom 2026.10.07-26.2 同步；升级任一方都必须同时调整另一侧。
mcprotocollib = "26.2"
# Netty 是安全边界：所有 io.netty 模块由 netty-bom 对齐到同一版本，
# 只改直接依赖会留下 netty-resolver / codec-base 等传递模块的旧版本。
# 升级原因、验证结论与回滚条件见 docs/decisions/0003-netty-upgrade.md。
netty = "4.2.20.Final"

# 运行时依赖（除协议外，其余在 M1 及之后按需引入）
kotlinxCoroutines = "1.11.0"
kotlinxSerializationJSON = "1.12.0"
# 与协议库传递依赖的 Adventure 主线一致；只用于适配层渲染文本。
adventure = "5.2.0"

# 测试与联调
# JUnit Platform 与 Jupiter 版本线不同：launcher 走 1.x，引擎走 5.x。
junit = "5.14.4"
junitPlatform = "1.14.4"
minestom = "2026.10.07-26.2"
slf4j = "2.0.20"
# 下游渲染基线（见 docs/architecture.md 第 6 节）。只被 samples 模块使用，
# 核心库不得依赖它；headless 后端是纯 Java，CI 无需显示器与 GL。
libgdx = "1.13.1"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# 协议后端：同时提供 776 的数据包、注册表数据与 Netty 传输。
mcprotocollib = { module = "org.geysermc.mcprotocollib:protocol", version.ref = "mcprotocollib" }

# netty-all 是聚合 POM（会拉进 protobuf、zstd、brotli 与本地传输构件），
# 因此按实际用到的模块逐个声明；BOM 负责把 MCPL、Minestom 传来的其它 Netty 模块
# （resolver、codec-base、native-unix-common 等）对齐到同一版本。
nettyBom = { module = "io.netty:netty-bom", version.ref = "netty" }
nettyBuffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
nettyCommon = { module = "io.netty:netty-common", version.ref = "netty" }
nettyTransport = { module = "io.netty:netty-transport", version.ref = "netty" }
nettyHandler = { module = "io.netty:netty-handler", version.ref = "netty" }

kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
adventurePlain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }

kotlinTestJunit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

minestom = { module = "net.minestom:minestom", version.ref = "minestom" }
libgdxCore = { module = "com.badlogicgames.gdx:gdx", version.ref = "libgdx" }
libgdxHeadless = { module = "com.badlogicgames.gdx:gdx-backend-headless", version.ref = "libgdx" }
# 本地库（gdx64.dll / libgdx64.so / libgdx.dylib）。headless 后端也会加载它，
# 所以“不需要 GL 上下文”不等于“不需要 natives”。
libgdxNatives = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "libgdx" }
slf4jSimple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[bundles]
# 客户端实际需要的 Netty 模块集合；配合对 netty-all 的 exclude 一起使用。
nettyClient = ["nettyBuffer", "nettyCommon", "nettyTransport", "nettyHandler"]

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
